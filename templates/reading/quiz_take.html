{% extends 'base.html' %}{% load i18n %}{% block content %}<section class="card quiz quiz-step"><header class="quiz-header"><div><p>{{ attempt.book.title }}</p><h1>第 <span data-current>1</span>/{{ questions|length }} 题</h1></div><progress max="{{ questions|length }}" value="1" aria-label="答题进度"></progress></header><form method="post" data-quiz-id="{{ attempt.pk }}">{% csrf_token %}{% for q in questions %}<fieldset data-question {% if not forloop.first %}hidden{% endif %}><legend>{{ q.prompt }}</legend><div class="optgroup vertical">{% for option in q.options %}<input class="optinput" type="radio" id="q{{ forloop.parentloop.counter0 }}o{{ forloop.counter0 }}" name="q{{ forloop.parentloop.counter0 }}" value="{{ forloop.counter0 }}"><label class="optbtn" for="q{{ forloop.parentloop.counter0 }}o{{ forloop.counter0 }}">{{ option }}</label>{% endfor %}</div></fieldset>{% endfor %}<p class="quiz-warning" role="alert" hidden>还有题目没有回答，请先完成再提交。</p><div class="quiz-controls"><button type="button" class="secondary" data-prev disabled>上一题</button><button type="button" data-next>下一题</button><button type="submit" data-submit hidden>提交答卷</button></div></form></section>
<script>(function(){var form=document.querySelector('[data-quiz-id]');if(!form)return;var pages=[].slice.call(form.querySelectorAll('[data-question]')),current=0,key='reading-garden-quiz-'+form.dataset.quizId,progress=document.querySelector('.quiz-header progress'),counter=document.querySelector('[data-current]'),prev=form.querySelector('[data-prev]'),next=form.querySelector('[data-next]'),submit=form.querySelector('[data-submit]'),warning=form.querySelector('.quiz-warning');try{var saved=JSON.parse(localStorage.getItem(key)||'{}');Object.keys(saved).forEach(function(name){var input=form.querySelector('[name="'+name+'"][value="'+saved[name]+'"]');if(input)input.checked=true;});}catch(e){}function show(index){current=Math.max(0,Math.min(index,pages.length-1));pages.forEach(function(page,i){page.hidden=i!==current;});counter.textContent=current+1;progress.value=current+1;prev.disabled=current===0;next.hidden=current===pages.length-1;submit.hidden=current!==pages.length-1;var focus=pages[current].querySelector('input:checked, input');if(focus)focus.focus();}form.addEventListener('change',function(){var saved={};form.querySelectorAll('input[type=radio]:checked').forEach(function(input){saved[input.name]=input.value;});localStorage.setItem(key,JSON.stringify(saved));warning.hidden=true;});prev.addEventListener('click',function(){show(current-1);});next.addEventListener('click',function(){show(current+1);});form.addEventListener('submit',function(event){var missing=pages.some(function(_,i){return !form.querySelector('[name="q'+i+'"]:checked');});if(missing){event.preventDefault();warning.hidden=false;var first=pages.findIndex(function(_,i){return !form.querySelector('[name="q'+i+'"]:checked');});show(first);}else{localStorage.removeItem(key);}});show(0);})();</script>{% endblock %}
