{% extends 'base.html' %}{% load i18n %}{% block content %}<section class="card narrow"><h1>{{ classroom.name }}</h1><p>{% trans "你叫什么名字？点一下自己的名字开始阅读。" %}</p><div class="namegrid">{% for s in students %}<form method="post">{% csrf_token %}<input type="hidden" name="student" value="{{ s.id }}"><button class="namebtn">{{ s.name }}</button></form>{% empty %}<p>{% trans "这个班还没有学生。" %}</p>{% endfor %}</div><p><a class="link" href="{% url 'student_login' %}">{% trans "换个班级" %}</a></p></section>{% endblock %}
