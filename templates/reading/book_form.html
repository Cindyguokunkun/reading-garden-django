{% extends 'base.html' %}{% load i18n %}{% block content %}<section class="card narrow"><h1>{% if book.pk %}{% trans "编辑书籍" %}{% else %}{% trans "添加书籍" %}{% endif %}</h1><form method="post">{% csrf_token %}<label>{% trans "书名 *" %}<input name="title" value="{{ book.title }}" required></label><label>{% trans "系列" %}<input name="series" value="{{ book.series }}" placeholder="{% trans '留空视为单本' %}"></label><label>{% trans "难度分类" %}<select name="category"><option value="">{% trans "未分类" %}</option>{% for value, label in categories %}<option value="{{ value }}" {% if book.category == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>{% trans "兰斯值" %}<input name="lexile" value="{{ book.lexile }}" maxlength="12" placeholder="{% trans '如 550L / BR200L' %}"></label><label>{% trans "词数" %}<input type="number" name="words" value="{{ book.words|default:'' }}" min="0"></label><label>{% trans "级别说明" %}<input name="level" value="{{ book.level }}"></label><p><button>{% trans "保存" %}</button> <a class="link" href="{% url 'library' %}">{% trans "返回图书馆" %}</a></p></form></section>{% endblock %}
