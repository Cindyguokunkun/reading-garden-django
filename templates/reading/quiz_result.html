{% extends 'base.html' %}{% block content %}<section class="card narrow result"><h1>{% if attempt.passed %}PASSED{% else %}TRY AGAIN{% endif %}</h1><div class="score">{{attempt.score}}%</div><p>{{correct}} / {{total}} correct</p><p>{% if attempt.passed %}The reading words have been added.{% else %}Read the book again before a new quiz.{% endif %}</p><a class="button" href="{% url 'quiz_start' %}?class={{attempt.student.classroom_id}}">Back</a></section>{% endblock %}
