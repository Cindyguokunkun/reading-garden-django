{% extends 'base.html' %}{% load i18n %}{% block content %}<section class="card narrow"><h1>{% trans "开始阅读测验" %}</h1><p>{% trans "先读完书，再答题。60% 过关，每本书最多 3 次答题机会，过关即累计词数。" %}</p>{% if persona.kind == 'student' %}<form method="post">{% csrf_token %}<label>{% trans "书名" %}<select name="book" required>{% regroup books by series as groups %}{% for group in groups %}<optgroup label="{{group.grouper}}">{% for b in group.list %}<option value="{{b.id}}"{% if b.id == chosen %} selected{% endif %}>{{b.title}}</option>{% endfor %}</optgroup>{% endfor %}</select></label><label>{% trans "阅读日期" %}<input type="date" name="date"></label><label>{% trans "阅读时长（可空）" %}<input type="number" name="minutes" min="0"></label><button>{% trans "开始答题" %}</button></form>{% elif classroom %}<form method="post">{% csrf_token %}<input type="hidden" name="class" value="{{classroom.id}}"><label>{% trans "学生" %}<select name="student" required>{% for s in students %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>{% trans "书名" %}<select name="book" required>{% regroup books by series as groups %}{% for group in groups %}<optgroup label="{{group.grouper}}">{% for b in group.list %}<option value="{{b.id}}"{% if b.id == chosen %} selected{% endif %}>{{b.title}}</option>{% endfor %}</optgroup>{% endfor %}</select></label><label>{% trans "阅读日期" %}<input type="date" name="date"></label><label>{% trans "阅读时长（可空）" %}<input type="number" name="minutes" min="0"></label><button>{% trans "开始答题" %}</button></form>{% else %}<p>{% trans "请先创建班级和学生。" %}</p>{% endif %}</section>{% endblock %}
