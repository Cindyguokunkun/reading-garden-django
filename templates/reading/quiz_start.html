{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Start Reading Quiz</h1>{% if classroom %}<form method="post">{% csrf_token %}<input type="hidden" name="class" value="{{classroom.id}}"><label>Student<select name="student" required>{% for s in students %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label><label>Book<select name="book" required>{% regroup books by series as groups %}{% for group in groups %}<optgroup label="{{group.grouper}}">{% for b in group.list %}<option value="{{b.id}}">{{b.title}}</option>{% endfor %}</optgroup>{% endfor %}</select></label><label>Reading date<input type="date" name="date"></label><label>Reading minutes (optional)<input type="number" name="minutes" min="0"></label><button>Begin Quiz</button></form>{% else %}<p>请先创建班级和学生。</p>{% endif %}</section>{% endblock %}
