{% extends 'base.html' %}{% block content %}
<section class="card narrow"><h1>Change password</h1>
<p>Change your own login password. Your parent's password will not change.</p>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label>
<label>New password (at least 6 characters)<input type="password" name="new_password" autocomplete="new-password" minlength="6" required></label>
<label>Enter the new password again<input type="password" name="confirm_password" autocomplete="new-password" minlength="6" required></label>
<button>Save new password</button></form>
<p><a class="link" href="{% url 'student_home' %}">Back to my home page</a></p></section>
{% endblock %}
