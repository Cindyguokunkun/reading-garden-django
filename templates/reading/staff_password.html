{% extends 'base.html' %}{% load i18n %}{% block content %}
<section class="card narrow"><h1>{% trans "修改密码" %}</h1>
<p>{% trans "修改你自己的登录密码，保存后不会退出登录。" %}</p>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<label>{% trans "当前密码" %}<input type="password" name="current_password" autocomplete="current-password" required></label>
<label>{% trans "新密码（至少 8 位）" %}<input type="password" name="new_password" autocomplete="new-password" required></label>
<label>{% trans "再次输入新密码" %}<input type="password" name="confirm_password" autocomplete="new-password" required></label>
<button>{% trans "保存新密码" %}</button></form>
<p><a class="link" href="{% url 'dashboard' %}">{% trans "返回工作台" %}</a></p></section>
{% endblock %}
